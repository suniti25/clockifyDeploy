version: '3.9'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: leave-backend
    entrypoint: ./entrypoint.sh
    command: >
      gunicorn leave_system.wsgi:application
      --bind 0.0.0.0:8000
      --workers 5
      --timeout 120
      --access-logfile -
    ports:
      - "8000:8000"
    volumes:
      - staticfiles-data:/app/staticfiles
      - staticfiles-data:/var/www/leave-management/staticfiles

    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "-H", "Host: leavemgmt.avinto.no", "http://127.0.0.1:8000/health/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  staticfiles-data: